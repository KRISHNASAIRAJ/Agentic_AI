services:
  postgres:
    image: postgres:16-alpine
    container_name: smsdetector-postgres
    environment:
      POSTGRES_DB: smsdetector
      POSTGRES_USER: sms
      POSTGRES_PASSWORD: sms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms -d smsdetector"]
      interval: 5s
      timeout: 3s
      retries: 10

  detection-service:
    build: ./detection-service
    container_name: smsdetector-detection
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/smsdetector
      DB_USER: sms
      DB_PASSWORD: sms
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  reputation-service:
    build: ./reputation-service
    container_name: smsdetector-reputation
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/smsdetector
      DB_USER: sms
      DB_PASSWORD: sms
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
