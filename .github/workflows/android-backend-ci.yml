name: SMS Detector CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Never grant write access to forks
permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  ANDROID_API_LEVEL: 34
  ANDROID_ARCH: x86_64
  ANDROID_PROFILE: pixel_5

jobs:
  # ------------------------------------------------------------------
  # PHASE 1: Validate environment / required configuration
  # ------------------------------------------------------------------
  validate-env:
    name: 1. Validate environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Validate required files and configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "== Tool versions =="
          java -version
          echo "== Repository structure =="
          for f in \
            android/gradlew \
            android/app/build.gradle.kts \
            android/local.properties.example \
            backend/pom.xml \
            backend/mvnw; do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; exit 1; fi
            echo "OK: $f"
          done
          echo "== Java version check =="
          java -version 2>&1 | grep -q '21' || { echo "Java 21 required"; exit 1; }
          echo "== Validate Android SDK path config =="
          if [ -n "${ANDROID_HOME:-}" ]; then echo "ANDROID_HOME=$ANDROID_HOME"; fi
          echo "ENV_VALIDATION=PASSED"

      - name: Validate Kotlin / Gradle syntax (configuration only)
        working-directory: android
        shell: bash
        run: bash ./gradlew help --no-daemon

  # ------------------------------------------------------------------
  # PHASE 2: Unit tests (Android + backend)
  # ------------------------------------------------------------------
  unit-tests:
    name: 2. Unit tests
    runs-on: ubuntu-latest
    needs: validate-env
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Android unit tests (DetectionEngineTest)
        working-directory: android
        shell: bash
        run: bash ./gradlew testDebugUnitTest --no-daemon

      - name: Publish Android unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Backend unit tests (Surefire)
        working-directory: backend
        shell: bash
        run: bash ./mvnw -B test

  # ------------------------------------------------------------------
  # PHASE 3: Backend integration tests (Failsafe, H2 in-memory DB)
  # ------------------------------------------------------------------
  integration-tests:
    name: 3. Integration tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Full backend verify (unit + *IT integration tests)
        working-directory: backend
        shell: bash
        run: bash ./mvnw -B verify

      - name: Publish integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-reports
          path: backend/**/target/failsafe-reports
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # PHASE 4: Android smoke test (instrumented, on emulator)
  # ------------------------------------------------------------------
  smoke-tests:
    name: 4. Smoke test (emulator)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Enable KVM for emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true
          test -r /dev/kvm && test -w /dev/kvm && echo "KVM_READY" || echo "KVM_UNAVAILABLE"

      - name: Run smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: ${{ env.ANDROID_ARCH }}
          profile: ${{ env.ANDROID_PROFILE }}
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 600000
          force-avd-creation: false
          working-directory: android
          script: |
            echo "=== DIAGNOSTICS ==="
            echo "ANDROID_HOME=$ANDROID_HOME"
            adb devices
            java -version
            echo "==================="
            bash ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.smsdetector.app.SmokeTest

      - name: Publish smoke test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: android/app/build/reports/androidTests/connected
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # PHASE 5: End-to-end test (navigation journey on emulator)
  # ------------------------------------------------------------------
  e2e-tests:
    name: 5. E2E test (emulator)
    runs-on: ubuntu-latest
    needs: smoke-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true
          test -r /dev/kvm && test -w /dev/kvm && echo "KVM_READY" || echo "KVM_UNAVAILABLE"

      - name: Run end-to-end journey test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          arch: ${{ env.ANDROID_ARCH }}
          profile: ${{ env.ANDROID_PROFILE }}
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 600000
          force-avd-creation: false
          working-directory: android
          script: |
            echo "=== DIAGNOSTICS ==="
            adb devices
            mkdir -p android/artifacts
            echo "==================="
            bash ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.smsdetector.app.EndToEndTest ; adb pull /data/local/tmp/sms_e2e.png android/artifacts/e2e_screen.png || true

      - name: Publish E2E test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-report
          path: |
            android/app/build/reports/androidTests/connected
            android/artifacts/e2e_screen.png
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # PHASE 6: Build downloadable debug APK
  # ------------------------------------------------------------------
  build-apk:
    name: 6. Build APK
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          bash ./gradlew assembleDebug --no-daemon
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/SMSDetector-debug.apk
          sha256sum artifacts/SMSDetector-debug.apk > artifacts/SMSDetector-debug.apk.sha256
          cat artifacts/SMSDetector-debug.apk.sha256

      - name: Upload APK artifact (download from Actions run)
        uses: actions/upload-artifact@v4
        with:
          name: SMSDetector-APK
          path: android/artifacts/
          retention-days: 30

      - name: Build summary
        run: |
          echo "### SMS Detector build succeeded ✅" >> $GITHUB_STEP_SUMMARY
          echo "Download **SMSDetector-APK** from this run's artifacts." >> $GITHUB_STEP_SUMMARY
