name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GRADLE_VERSION: 8.13
  JAVA_VERSION: '17'

jobs:
  validate-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Verify required files
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          java -version
      - name: Check Gradle wrapper
        run: ./gradlew --version

  unit-tests:
    needs: validate-env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      # GitHub runners already ship the Android SDK; the wrapper just needs its path.
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" >> local.properties
      - name: Run JVM tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  build:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" >> local.properties
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
