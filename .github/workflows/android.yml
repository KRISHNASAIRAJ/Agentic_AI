name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GRADLE_VERSION: 8.13
  JAVA_VERSION: '17'

jobs:
  validate-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Verify required files
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          java -version
      - name: Check Gradle wrapper
        run: bash ./gradlew --version

  unit-tests:
    needs: validate-env
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      # GitHub runners already ship the Android SDK; the wrapper just needs its path.
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" >> local.properties
      - name: Run JVM tests
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  build:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" >> local.properties
      - name: Materialise signing key
        env:
          JUPITER_KEYSTORE_B64: ${{ secrets.JUPITER_KEYSTORE_B64 }}
          JUPITER_KEYSTORE_PASS: ${{ secrets.JUPITER_KEYSTORE_PASS }}
          JUPITER_KEY_ALIAS: ${{ secrets.JUPITER_KEY_ALIAS }}
          JUPITER_KEY_PASS: ${{ secrets.JUPITER_KEY_PASS }}
        run: |
          set -euo pipefail
          if [ -z "${JUPITER_KEYSTORE_B64:-}" ]; then
            echo "No signing secret - building with the shared debug key."
            exit 0
          fi
          printf '%s' "$JUPITER_KEYSTORE_B64" | base64 -d > jupiter-release.jks
          {
            echo "storeFile=jupiter-release.jks"
            echo "storePassword=$JUPITER_KEYSTORE_PASS"
            echo "keyAlias=$JUPITER_KEY_ALIAS"
            echo "keyPassword=$JUPITER_KEY_PASS"
          } > keystore.properties
          echo "Signing key materialised from secrets."
      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
